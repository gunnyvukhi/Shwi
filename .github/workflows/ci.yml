name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ui-verification:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run ESLint
        working-directory: ./ui
        run: npm run lint

      - name: Test Production Build
        working-directory: ./ui
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_GOOGLE_CLIENT_ID: dummy_ci_client_id
          VITE_APPLE_CLIENT_ID: dummy_ci_apple_id
        run: npm run build

  api-verification:
    name: Backend Syntax & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax & Compilation
        working-directory: ./api
        run: |
          python -m py_compile app.py config.py email_service.py models.py utils.py routes/auth.py routes/user.py
