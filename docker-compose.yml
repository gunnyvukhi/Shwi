version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: shwi_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: ./api
    restart: always
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root_password
      - MYSQL_DB=shwi_db
      # You can add other variables from your .env here
      # - SECRET_KEY=your_secret_key
    ports:
      - "5000:5000"
    depends_on:
      - db

  ui:
    build: ./ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
